# application.yml raiz: este archivo lo sirve el Config Server a TODOS
# los clientes (Gateway, Auth, Alumno, Cursos, Administracion, Notas, ...),
# sin importar su spring.application.name.
#
# IMPORTANTE: ningun secreto real se versiona en git. El unico secreto es
# jwt.secret, que solo necesitan el Gateway (valida el JWT) y Auth (lo firma);
# se inyecta en runtime con la variable de entorno JWT_SECRET.
#
# Los microservicios de datos NO necesitan el secreto: el Gateway valida el
# JWT y les propaga el rol autenticado en el header interno X-Gateway-Role,
# y solo el Gateway puede alcanzarlos (sus puertos no se publican).
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

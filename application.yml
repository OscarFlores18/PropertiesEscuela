# application.yml raiz: este archivo lo sirve el Config Server a TODOS
# los clientes (Gateway, Auth, Alumno, Cursos, Administracion, Notas, ...),
# sin importar su spring.application.name. Por eso centralizamos aca los
# secretos compartidos: se definen una sola vez y todos leen lo mismo.
#
# IMPORTANTE: ningun secreto real se versiona en git. Los valores se inyectan
# en runtime mediante variables de entorno del sistema operativo / contenedor:
#   - jwt.secret              <- variable JWT_SECRET
#   - gateway.internal-secret <- variable GATEWAY_INTERNAL_SECRET
# Si la variable no existe, el servicio falla al arrancar (a proposito).
#
# Para correrlo:
#   - Docker: ambas variables van en el archivo .env de docker-compose.yml
#     (ver .env.example en la raiz del proyecto).
#   - Dev/Eclipse: Run As -> Run Configurations -> Environment -> agregar
#     JWT_SECRET y GATEWAY_INTERNAL_SECRET con los mismos valores en Auth,
#     Gateway y los microservicios de datos.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

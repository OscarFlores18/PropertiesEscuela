server:
  port: 8081

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: modulo-auth
              uri: lb://AUTH
              predicates:
                - Path=/auth/**

            - id: modulo-alumnos
              uri: lb://modulo-alumnos
              predicates:
                - Path=/alumnos/**

            - id: modulo-cursos
              uri: lb://modulo-cursos
              predicates:
                - Path=/cursos/**

            - id: modulo-notas
              uri: lb://modulo-notas
              predicates:
                - Path=/notas/**

            - id: modulo-administracion
              uri: lb://modulo-administracion
              predicates:
                - Path=/personal/**

            - id: swagger-alumno
              uri: lb://modulo-alumnos
              predicates:
                - Path=/alumno/**
              filters:
                - StripPrefix=1

            - id: swagger-cursos
              uri: lb://modulo-cursos
              predicates:
                - Path=/curso/**
              filters:
                - StripPrefix=1

            - id: swagger-notas
              uri: lb://modulo-notas
              predicates:
                - Path=/nota/**
              filters:
                - StripPrefix=1

            - id: swagger-administracion
              uri: lb://modulo-administracion
              predicates:
                - Path=/administracion/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10

# Documentacion agregada: una sola UI que lista los Swagger de cada microservicio.
# Cada url pasa por las rutas swagger-* definidas arriba (con StripPrefix=1).
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Alumnos
        url: /alumno/v3/api-docs
      - name: Cursos
        url: /curso/v3/api-docs
      - name: Notas
        url: /nota/v3/api-docs
      - name: Administracion
        url: /administracion/v3/api-docs
